<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>奔饭 Project · 致远桥逆流</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef0e8;color:#203530;font:16px/1.7 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:35px 30px}nav{display:flex;justify-content:space-between;border-bottom:1px solid #bec9bd;padding-bottom:15px;font-size:13px;letter-spacing:.12em}.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:45px;align-items:center;padding:42px 0}h1{font-size:clamp(46px,7vw,82px);line-height:1.13;margin:15px 0;letter-spacing:-.06em}h1 small{display:block;font-size:.34em;letter-spacing:.2em;margin-top:20px}.tag{color:#577160;font-size:13px;letter-spacing:.15em}.lead{color:#53665d;max-width:480px}.map{background:#c7d7c5;border-radius:130px 130px 22px 22px;padding:30px;height:330px;position:relative;overflow:hidden}.lake{position:absolute;background:#8cb8c0;left:0;right:0;top:120px;height:130px;transform:rotate(-8deg)}.road{position:absolute;background:#e6ddc4;width:68px;top:0;bottom:0;left:calc(50% - 34px);transform:rotate(9deg);border-left:5px solid #c7b892;border-right:5px solid #c7b892}.building{position:absolute;background:#efe8d2;border:5px solid #b5a78b;padding:8px 15px;box-shadow:5px 8px 0 #0001;font-size:13px}.canteen{left:36%;top:25px;background:#ead08d}.classroom{left:15%;bottom:24px;background:#a7c4da}.bridge{position:absolute;top:165px;left:52%;background:#f5eee0;padding:2px 8px;transform:rotate(-9deg);font-size:12px}.dot{position:absolute;width:11px;height:16px;background:#304c62;box-shadow:0 -5px 0 -2px #e4c4a6;left:49%;top:65%}.dot:nth-of-type(5){left:55%;top:42%}.dot:nth-of-type(6){left:50%;top:31%}.dot:nth-of-type(7){left:46%;top:22%}.panel{background:#fff9;border:1px solid #cbd2c6;border-radius:18px;padding:25px}h2{margin:0 0 14px;font-size:20px}.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.role{background:transparent;border:1px solid #becbbf;border-radius:12px;text-align:left;padding:17px;cursor:pointer;color:#233c32;font:inherit}.role[aria-pressed=true]{background:#264e40;color:white;border-color:#264e40}.role span{display:block;font-size:12px;opacity:.75;margin-top:6px}.settings{display:flex;align-items:end;gap:16px;margin-top:22px;flex-wrap:wrap}label{font-size:13px;color:#526157}select{display:block;margin-top:5px;padding:11px;border:1px solid #c0cbbf;border-radius:8px;background:#fff;color:#203530;font:inherit}#start{border:0;background:#b94f2c;color:#fff;padding:13px 32px;border-radius:8px;font:inherit;cursor:pointer;margin-left:auto}footer{padding:26px 0;font-size:12px;color:#68766b}a{color:inherit}.hint{font-size:13px;color:#667366;margin-top:15px}.status{display:inline-block;border:1px solid #acbba8;border-radius:30px;padding:2px 13px;margin-top:12px;font-size:12px}@media(max-width:650px){main{padding:22px 18px}.hero{grid-template-columns:1fr;gap:15px;padding:25px 0}.map{height:220px}.roles{grid-template-columns:1fr 1fr}.settings{display:grid;grid-template-columns:1fr 1fr}select{width:100%}#start{grid-column:1/-1;width:100%}}
</style>
<main><nav><span>BENFAN PROJECT / 奔饭计划</span><span id="edition"></span></nav><div class="hero"><div><div class="tag">天一校园 · 纵卷轴弹幕试玩</div><h1>致远桥<br>逆流。<small>今天几点去食堂？</small></h1><p class="lead" id="description"></p><span class="status">Taisei C → WebAssembly · 六面 + Extra</span></div><div class="map" aria-label="国际部经致远桥前往食堂的路线示意"><div class="lake"></div><div class="road"></div><div class="building canteen">食堂</div><div class="building classroom">国际部</div><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="bridge">致远桥</span></div></div><section class="panel"><h2>01 / 选择出发的人</h2><div class="roles"><button class="role" data-role="0" aria-pressed="true">国际部<span>早去 · 扩散 · 蓝色</span></button><button class="role" data-role="1" aria-pressed="false">高一<span>快行 · 直射 · 深色</span></button><button class="role" data-role="2" aria-pressed="false">高二<span>均衡 · 直射 · 灰色</span></button><button class="role" data-role="3" aria-pressed="false">高三<span>精确 · 强射 · 白色</span></button></div><div class="settings"><label>02 / 路线<select id="stage"><option value="0">六面完整主线</option><option value="1">一面 · 出楼</option><option value="2">二面 · 湖边</option><option value="3">三面 · 致远桥去程</option><option value="4">四面 · 食堂</option><option value="5">五面 · 三路汇流</option><option value="6">六面 · 致远桥逆流</option><option value="7">Extra · 晚去奔饭</option></select></label><label>难度<select id="diff"><option value="1">Easy · 熟悉路线</option><option value="2">Normal · 下课人流</option><option value="3">Hard · 奔饭高峰</option><option value="4">Lunatic · 极限穿行</option></select></label><button id="start">出发 →</button></div><p class="hint">方向键移动，Shift 慢行，Z 射击／确认，X“借过”，Esc 暂停。Extra 使用固定高难度。首次加载需要下载引擎和素材。</p></section><footer>玩法验证初版。场景为校园路线示意；人物立绘、Boss 和音乐仍有上游占位素材。游戏设定不代表学校真实作息。<br>基于 <a href="https://taisei-project.org/">Taisei Project</a> · <a href="https://github.com/TouhouDebian/BenfanProject-Taisei" id="source">源码与设计说明</a> · <a id="other">切换另一版</a></footer></main>
<script src="mode.js"></script><script>let role=0;const dodge=window.BENFAN_RULE===1;document.querySelector('#edition').textContent=dodge?'B / 避让版':'A / 射击版';document.querySelector('#description').textContent=dodge?'去时一路清静，回来迎上奔饭大军。观察人流，慢行穿隙，必要时说一声“借过”。':'把奔饭路编成一场符卡战。躲过迎面人流，用抽象信号挑战关底的人流编排者。';document.querySelector('#other').href=dodge?'../shooting/':'../dodging/';document.querySelector('#source').href='https://github.com/TouhouDebian/BenfanProject-Ta'+'isei';for(const b of document.querySelectorAll('.role'))b.onclick=()=>{role=Number(b.dataset.role);for(const r of document.querySelectorAll('.role'))r.setAttribute('aria-pressed',r===b?'true':'false')};document.querySelector('#start').onclick=()=>{location.href='game.html?'+new URLSearchParams({role,stage:document.querySelector('#stage').value,diff:document.querySelector('#diff').value})};</script></html>
